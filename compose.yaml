services:
  yue2:
    build: .
    # One process per GPU. Do not scale onto the same GPU/data volume.
    cpus: ${YUE2_CPUS:-4}
    mem_limit: ${YUE2_MEMORY_LIMIT:-48g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${YUE2_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "127.0.0.1:${YUE2_PORT:-8000}:8000"
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      YUE2_API_KEY: ${YUE2_API_KEY:?Set YUE2_API_KEY in .env}
      YUE2_DEVICE: cuda
      YUE2_BACKEND: ${YUE2_BACKEND:-vllm}
      YUE2_RESIDENT_MODELS: ${YUE2_RESIDENT_MODELS:-true}
      YUE2_AR_CONCURRENCY: ${YUE2_AR_CONCURRENCY:-4}
      YUE2_NAR_BATCH_SIZE: ${YUE2_NAR_BATCH_SIZE:-2}
      YUE2_AR_NAR_OVERLAP: ${YUE2_AR_NAR_OVERLAP:-true}
      YUE2_VLLM_MAX_NUM_SEQS: ${YUE2_VLLM_MAX_NUM_SEQS:-4}
      YUE2_VLLM_MAX_NUM_BATCHED_TOKENS: ${YUE2_VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      YUE2_VLLM_GPU_MEMORY_UTILIZATION: ${YUE2_VLLM_GPU_MEMORY_UTILIZATION:-0.30}
      YUE2_AR_BATCH_WAIT_MS: ${YUE2_AR_BATCH_WAIT_MS:-50}
      YUE2_MEMORY_BUDGET_GIB: ${YUE2_MEMORY_BUDGET_GIB:-30}
      YUE2_ODE_STEPS: ${YUE2_ODE_STEPS:-32}
      YUE2_QUANTIZATION: ${YUE2_QUANTIZATION:-none}
      YUE2_WARMUP: ${YUE2_WARMUP:-true}
      YUE2_MAX_PENDING: ${YUE2_MAX_PENDING:-16}
      YUE2_TASK_TIMEOUT_SECONDS: ${YUE2_TASK_TIMEOUT_SECONDS:-1200}
      YUE2_ARTIFACT_RETENTION_SECONDS: ${YUE2_ARTIFACT_RETENTION_SECONDS:-86400}
      YUE2_ARTIFACT_MAX_GIB: ${YUE2_ARTIFACT_MAX_GIB:-5}
      YUE2_ARTIFACT_CLEANUP_INTERVAL_SECONDS: ${YUE2_ARTIFACT_CLEANUP_INTERVAL_SECONDS:-300}
    volumes:
      - model-cache:/data/huggingface
      - job-data:/data/jobs
volumes:
  model-cache:
  job-data:
