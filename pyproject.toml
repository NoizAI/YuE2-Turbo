[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yue2-infer"
version = "0.1.6"
description = "YuE2 music generation with editable symbolic plans"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "MODEL_LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
    "torch==2.10.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "safetensors==0.7.0",
    "tiktoken==0.12.0",
    "numpy==2.2.6",
    "soundfile==0.13.1",
    "accelerate==1.13.0",
]

[project.optional-dependencies]
fast = ["vllm==0.19.0", "triton==3.6.0"]
server = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
          "httpx>=0.28,<1", "python-multipart>=0.0.18", "vllm==0.19.0", "triton==3.6.0",
          "mir_eval==0.8.2", "pretty_midi==0.2.10", "mido==1.3.3", "scipy==1.15.3"]
test = ["pytest==9.0.3", "fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1",
        "python-multipart>=0.0.18"]

[project.urls]
Repository = "https://github.com/multimodal-art-projection/YuE"
Demo = "https://map-yue2.github.io/"
Models = "https://huggingface.co/m-a-p/YuE2-3B"

[project.scripts]
yue2 = "yue2.cli:main"
yue2-serve = "yue2.service:main"
yue2-web = "yue2.web_gateway:main"
yue2-benchmark = "yue2.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yue2 = ["studio.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
